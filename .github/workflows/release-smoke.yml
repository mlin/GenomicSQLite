name: Release smoke tests
run-name: Release smoke tests — ${{ inputs.version }}

# Verify a published release (or release candidate) the way users receive it:
# install each binding from its public package repository and run the
# repository's existing smoke test for it, on every platform for which a
# native library is shipped. Dispatch manually once a release has finished
# publishing, as the registries can take some minutes to propagate it.
#
# macOS note: Apple's system SQLite is built without loadable-extension
# support, so the PyPI, crates.io, and bundle jobs use Homebrew's Python /
# SQLite there -- the configuration in which these bindings can run on macOS
# outside conda (whose packages carry their own SQLite) and JDBC (whose jar
# bundles its own).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to verify, e.g. 0.10.0-rc.1 or 0.10.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  pypi:
    name: PyPI / ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute the PyPI version spelling
        id: v
        run: |
          v="${{ inputs.version }}"
          v="${v#v}"
          # PyPI spells prereleases 0.10.0rc1 where semver has 0.10.0-rc.1
          echo "pypi-version=$(printf '%s' "$v" | sed -E 's/-rc\.([0-9]+)$/rc\1/; s/-alpha\.([0-9]+)$/a\1/; s/-beta\.([0-9]+)$/b\1/')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: runner.os != 'macOS'
        with:
          python-version: "3.12"
      - name: Install Homebrew Python (links a full SQLite)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12
          echo "PYBIN=$(brew --prefix python@3.12)/bin/python3.12" >> "$GITHUB_ENV"
      - name: Note the setup-python interpreter
        if: runner.os != 'macOS'
        run: echo "PYBIN=python3" >> "$GITHUB_ENV"
      - name: Install GenomicSQLite from PyPI & run the smoke test
        run: |
          "$PYBIN" -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install "genomicsqlite==${{ steps.v.outputs.pypi-version }}"
          "$RUNNER_TEMP/venv/bin/python" test/genomicsqlite_smoke_test.py

  conda:
    name: conda / ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute the conda version spelling
        id: v
        run: |
          v="${{ inputs.version }}"
          v="${v#v}"
          # conda spells prereleases 0.10.0rc1 where semver has 0.10.0-rc.1
          echo "pypi-version=$(printf '%s' "$v" | sed -E 's/-rc\.([0-9]+)$/rc\1/; s/-alpha\.([0-9]+)$/a\1/; s/-beta\.([0-9]+)$/b\1/')" >> "$GITHUB_OUTPUT"
          case "$v" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          auto-activate: true
          conda-remove-defaults: "true"
      - name: Install GenomicSQLite from the mlin channel
        shell: bash -el {0}
        run: |
          channels=(-c mlin)
          if [ "${{ steps.v.outputs.prerelease }}" = "true" ]; then
            # release candidates are uploaded under the rc label only
            channels=(-c mlin/label/rc -c mlin)
          fi
          conda install -y "${channels[@]}" "genomicsqlite=${{ steps.v.outputs.pypi-version }}"
      - name: Run the Python smoke test
        shell: bash -el {0}
        run: python test/genomicsqlite_smoke_test.py

  crates:
    name: crates.io / ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute the release version
        id: v
        run: |
          v="${{ inputs.version }}"
          echo "semver=${v#v}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Homebrew SQLite (full build) for linking
        if: runner.os == 'macOS'
        run: |
          brew install sqlite
          echo "SQLITE3_LIB_DIR=$(brew --prefix sqlite)/lib" >> "$GITHUB_ENV"
          echo "SQLITE3_INCLUDE_DIR=$(brew --prefix sqlite)/include" >> "$GITHUB_ENV"
      - name: Pin the smoke crate to the release version
        run: |
          sed -i -E 's/^genomicsqlite = .*/genomicsqlite = "=${{ steps.v.outputs.semver }}"/' \
            test/cargo_smoke_test/Cargo.toml
          grep '^genomicsqlite' test/cargo_smoke_test/Cargo.toml
      - name: Build & run the smoke crate against crates.io
        working-directory: test/cargo_smoke_test
        run: |
          cargo run --release 2>&1 | tee smoke.out
          grep -q "GenomicSQLite v${{ steps.v.outputs.semver }}" smoke.out

  maven:
    name: Maven / ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute the release version
        id: v
        run: |
          v="${{ inputs.version }}"
          echo "semver=${v#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run MavenSmokeTest against the mvn-repo
        working-directory: test/MavenSmokeTest
        run: |
          mvn -B -DGENOMICSQLITE_VERSION="${{ steps.v.outputs.semver }}" compile \
            org.codehaus.mojo:exec-maven-plugin:3.5.0:java \
            -Dexec.mainClass=net.mlin.genomicsqlite.MavenSmokeTest | tee smoke.out
          grep -q "GenomicSQLite v${{ steps.v.outputs.semver }}" smoke.out

  bundle:
    name: Release bundle / ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute the release version
        id: v
        run: |
          v="${{ inputs.version }}"
          echo "semver=${v#v}" >> "$GITHUB_OUTPUT"
      - name: Download the release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ steps.v.outputs.semver }}" \
            --repo mlin/GenomicSQLite \
            --pattern "GenomicSQLite-v${{ steps.v.outputs.semver }}.zip"
          unzip -q "GenomicSQLite-v${{ steps.v.outputs.semver }}.zip" -d bundle
      - name: Install SQLite development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev
      - name: Install Homebrew SQLite (full build)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite
          echo "SQLITE3_LIB_DIR=$(brew --prefix sqlite)/lib" >> "$GITHUB_ENV"
          echo "SQLITE3_INCLUDE_DIR=$(brew --prefix sqlite)/include" >> "$GITHUB_ENV"
      - name: Compile & run the C API smoke test
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   target=x86_64-linux-gnu ;;
            Linux-ARM64) target=aarch64-linux-gnu ;;
            macOS-ARM64) target=aarch64-darwin ;;
            *) echo "::error::no shipped library for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          cc -O2 -Ibundle -I"${SQLITE3_INCLUDE_DIR:-/usr/include}" test/capi_smoke_test.c \
            -o capi_smoke_test \
            -L "bundle/lib/$target" -L"${SQLITE3_LIB_DIR:-/usr/lib}" -lgenomicsqlite -lsqlite3
          if [ "${{ runner.os }}" = "Linux" ]; then
            LD_LIBRARY_PATH="$PWD/bundle/lib/$target" ./capi_smoke_test
          else
            DYLD_LIBRARY_PATH="$PWD/bundle/lib/$target" ./capi_smoke_test
          fi
