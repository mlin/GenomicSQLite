[package]
name = "genomicsqlite"
# Release versioning: the git tag is the version source of truth.
# This literal is bookkeeping (the last stamped version); it is not
# bumped to cut a release. At publish time the tag's version is
# stamped into the publish checkout (cargo set-version) and the
# crate is published from there. Cargo.lock is committed to pin
# dependency versions; its root entry follows the stamp in the
# publish checkout only.
version = "0.10.0"
description = "Genomics Extension for SQLite"
authors = ["Mike Lin <dna@mlin.net>"]
edition = "2018"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/mlin/GenomicSQLite"
documentation = "https://mlin.github.io/GenomicSQLite"
include = ["src/**/*", "Cargo.toml", "build.rs", "lib/*/libgenomicsqlite.so", "lib/*/libgenomicsqlite.dylib"]

[features]
# Use default-features=false to prevent bundling a platform-specific libgenomicsqlite into your
# compilation unit. Then at runtime, you must either set env LIBGENOMICSQLITE to the library path,
# or place it somewhere it'll be found by dlopen("libgenomicsqlite").
default = ["bundle_libgenomicsqlite"]
bundle_libgenomicsqlite = []

[dependencies]
json = "^0.12"
tempfile = "^3"

[dependencies.rusqlite]
version = ">=0.25, <0.42"
features = ["load_extension", "vtab"]

[dev-dependencies.uuid]
version = "^1"
features = ["v4"]
