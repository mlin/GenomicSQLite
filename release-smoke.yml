name: Release smoke tests

# Verify a published release (or release candidate) the way users receive it:
# install each binding from its public package repository and run the
# repository's existing smoke test for it, on every platform for which a
# native library is shipped. Dispatch manually once a release has finished
# publishing, as the registries can take some minutes to propagate it.

on:
  # Temporary while this workflow is under review: also run on every push to
  # its own branch (against the default version below), so the jobs can be
  # exercised end to end. Removed before merging; the merged workflow is
  # workflow_dispatch only.
  push:
    branches: [conrad/release-smoke-workflow]
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to verify, e.g. 0.10.0-rc.1 or 0.10.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prep:
    name: Normalize version spellings
    runs-on: ubuntu-24.04
    outputs:
      semver: ${{ steps.v.outputs.semver }}
      pypi-version: ${{ steps.v.outputs.pypi-version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Compute per-registry version spellings
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # push events carry no inputs; default to the current release
          # candidate so branch pushes exercise the full workflow
          raw_version="${INPUT_VERSION:-0.10.0-rc.1}"
          semver="${raw_version#v}"
          if ! [[ "$semver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(rc|alpha|beta)\.[0-9]+)?$ ]]; then
            echo "::error::version '$INPUT_VERSION' is not a supported release version"
            exit 1
          fi
          # PyPI & conda spell prereleases 0.10.0rc1 where semver has 0.10.0-rc.1
          pypi="$(echo "$semver" | sed -E 's/-rc\.([0-9]+)$/rc\1/; s/-alpha\.([0-9]+)$/a\1/; s/-beta\.([0-9]+)$/b\1/')"
          prerelease=false
          if [[ "$semver" == *-* ]]; then prerelease=true; fi
          {
            echo "semver=$semver"
            echo "pypi-version=$pypi"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "verifying release: semver=$semver pypi/conda=$pypi prerelease=$prerelease"

  pypi:
    name: PyPI / ${{ matrix.runs-on }}
    needs: prep
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install GenomicSQLite from PyPI
        run: pip install "genomicsqlite==${{ needs.prep.outputs.pypi-version }}"
      - name: Run the Python smoke test
        run: python3 test/genomicsqlite_smoke_test.py

  conda:
    name: conda / ${{ matrix.runs-on }}
    needs: prep
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
      - name: Install GenomicSQLite from the mlin channel
        shell: bash -el {0}
        run: |
          channels=(-c mlin)
          if [ "${{ needs.prep.outputs.prerelease }}" = "true" ]; then
            # release candidates are uploaded under the rc label only
            channels=(-c mlin/label/rc -c mlin)
          fi
          conda install -y "${channels[@]}" "genomicsqlite=${{ needs.prep.outputs.pypi-version }}"
      - name: Run the Python smoke test
        shell: bash -el {0}
        run: python test/genomicsqlite_smoke_test.py

  crates:
    name: crates.io / ${{ matrix.runs-on }}
    needs: prep
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin the smoke crate to the release version
        run: |
          sed -i.bak -E 's|^genomicsqlite = ".*"|genomicsqlite = "=${{ needs.prep.outputs.semver }}"|' test/cargo_smoke_test/Cargo.toml
          rm -f test/cargo_smoke_test/Cargo.toml.bak test/cargo_smoke_test/Cargo.lock
          grep '^genomicsqlite' test/cargo_smoke_test/Cargo.toml
      - name: Build & run the smoke crate against crates.io
        working-directory: test/cargo_smoke_test
        run: |
          cargo run --release 2>&1 | tee smoke.out
          grep -q "GenomicSQLite v${{ needs.prep.outputs.semver }}" smoke.out

  maven:
    name: Maven / ${{ matrix.runs-on }}
    needs: prep
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run MavenSmokeTest against the mvn-repo
        working-directory: test/MavenSmokeTest
        run: |
          mvn -B -DGENOMICSQLITE_VERSION="${{ needs.prep.outputs.semver }}" compile \
            org.codehaus.mojo:exec-maven-plugin:3.5.0:java \
            -Dexec.mainClass=net.mlin.genomicsqlite.MavenSmokeTest | tee smoke.out
          grep -q "GenomicSQLite v${{ needs.prep.outputs.semver }}" smoke.out

  bundle:
    name: Release bundle / ${{ matrix.runs-on }}
    needs: prep
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ needs.prep.outputs.semver }}" \
            --pattern "GenomicSQLite-v${{ needs.prep.outputs.semver }}.zip"
          unzip -q "GenomicSQLite-v${{ needs.prep.outputs.semver }}.zip" -d bundle
      - name: Install SQLite development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev
      - name: Compile & run the C API smoke test
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   target=x86_64-linux-gnu ;;
            Linux-ARM64) target=aarch64-linux-gnu ;;
            macOS-ARM64) target=aarch64-darwin ;;
            *) echo "::error::no shipped library for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          cc -O2 -Ibundle test/capi_smoke_test.c -o capi_smoke_test \
            -L "bundle/lib/$target" -lgenomicsqlite -lsqlite3
          if [ "${{ runner.os }}" = "Linux" ]; then
            LD_LIBRARY_PATH="$PWD/bundle/lib/$target" ./capi_smoke_test
          else
            DYLD_LIBRARY_PATH="$PWD/bundle/lib/$target" ./capi_smoke_test
          fi
