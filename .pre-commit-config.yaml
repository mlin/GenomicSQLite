repos:
- repo: local
  hooks:
  - id: clang-format
    name: clang-format
    language: system
    files: \.(c|cc|cxx|cpp|h|hpp|hxx)$
    exclude: (json1|uint)\.c
    verbose: true
    entry: clang-format
    args: [-i,'-style={IndentWidth: 4, ColumnLimit: 100, BreakStringLiterals: false, ReflowComments: false}']
  - id: cppcheck
    name: cppcheck
    language: system
    files: \.(c|cc|cxx|cpp|h|hpp|hxx)$
    exclude: json1\.c
    verbose: true
    entry: cppcheck
    args: [-q,--std=c++11]
  - id: ruff-check
    name: ruff-check
    language: system
    types: [python]
    verbose: true
    entry: ruff check
  - id: ruff-format
    name: ruff-format
    language: system
    types: [python]
    verbose: true
    entry: ruff format
